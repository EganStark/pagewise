<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#211712" />
  <title>Pagewise is offline</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:28px;display:grid;place-items:center;color:#ededed;background:radial-gradient(circle at 70% 20%,rgba(139,91,62,.14),transparent 35%),#151514;font-family:system-ui,sans-serif}.card{width:min(440px,100%);padding:32px;background:#211f1d;border:1px solid #38312b;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.25)}.mark{width:54px;height:54px;display:grid;place-items:center;color:#211712;background:#e0995e;border-radius:14px;font-size:27px}h1{margin:24px 0 10px;font-family:Georgia,serif;font-size:32px;font-weight:500}p{margin:0;color:#a9a39d;font-size:14px;line-height:1.7}.note{margin-top:18px;padding:12px;color:#d2c6bb;background:#2a2723;border-radius:9px;font-size:12px}button{min-height:42px;margin-top:22px;padding:0 17px;color:#211712;background:#e0995e;border:0;border-radius:9px;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">▤</div><h1>Your library is resting offline.</h1><p>Pagewise needs a connection to load your private synchronized library and save reading updates.</p><div class="note">Nothing has been saved or changed while offline.</div><button onclick="location.reload()">Try again</button></main></body>
</html>
